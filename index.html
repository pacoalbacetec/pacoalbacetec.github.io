<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Paco Albacete</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg-page:     #f9f9f8;
      --bg-card:     #ffffff;
      --bg-hover:    #f9f9f8;
      --bg-avatar:   #f0f0ee;
      --border:      #e8e8e6;
      --border-hover:#d0d0ce;
      --text-main:   #1a1a1a;
      --text-role:   #888888;
      --text-loc:    #aaaaaa;
      --text-foot:   #cccccc;
      --arrow:       #cccccc;
      --dot-border:  #ffffff;
      --toggle-bg:   #f0f0ee;
      --toggle-border:#e8e8e6;
      --toggle-icon: #888888;
    }

    [data-theme="dark"] {
      --bg-page:     #0d1117;
      --bg-card:     #161b22;
      --bg-hover:    #1c2230;
      --bg-avatar:   #1c2230;
      --border:      #30363d;
      --border-hover:#484f58;
      --text-main:   #e6edf3;
      --text-role:   #8b949e;
      --text-loc:    #6e7681;
      --text-foot:   #484f58;
      --arrow:       #484f58;
      --dot-border:  #161b22;
      --toggle-bg:   #1c2230;
      --toggle-border:#30363d;
      --toggle-icon: #8b949e;
    }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg-page);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      transition: background 0.2s, color 0.2s;
    }

    .theme-toggle {
      position: fixed;
      top: 1.25rem;
      right: 1.25rem;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: var(--toggle-bg);
      border: 1px solid var(--toggle-border);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s, border-color 0.2s;
    }
    .theme-toggle:hover { border-color: var(--border-hover); }
    .theme-toggle svg { color: var(--toggle-icon); }

    .icon-sun  { display: none; }
    .icon-moon { display: block; }
    [data-theme="dark"] .icon-sun  { display: block; }
    [data-theme="dark"] .icon-moon { display: none; }

    .card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 2.5rem 2rem;
      max-width: 360px;
      width: 100%;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.1rem;
      transition: background 0.2s, border-color 0.2s;
    }

    .avatar-wrap { position: relative; width: 88px; height: 88px; }

    .avatar {
      width: 88px; height: 88px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid var(--border);
      display: block;
    }

    .avatar-placeholder {
      width: 88px; height: 88px;
      border-radius: 50%;
      background: var(--bg-avatar);
      border: 2px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s, border-color 0.2s;
    }

    .status-dot {
      position: absolute;
      bottom: 4px; right: 4px;
      width: 13px; height: 13px;
      border-radius: 50%;
      background: #22c55e;
      border: 2.5px solid var(--dot-border);
      transition: border-color 0.2s;
    }

    .name  { font-size: 22px; font-weight: 500; color: var(--text-main); line-height: 1.2; }
    .role  { font-size: 14px; color: var(--text-role); margin-top: -4px; }
    .location {
      font-size: 13px; color: var(--text-loc);
      display: flex; align-items: center; gap: 4px;
      margin-top: -6px;
    }

    .divider { width: 100%; height: 1px; background: var(--border); transition: background 0.2s; }

    .links { display: flex; flex-direction: column; gap: 8px; width: 100%; }

    .link-btn {
      display: flex; align-items: center; gap: 10px;
      padding: 11px 16px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--bg-card);
      color: var(--text-main);
      font-size: 14px;
      font-family: 'DM Sans', sans-serif;
      text-decoration: none;
      transition: background 0.15s, border-color 0.15s;
    }
    .link-btn:hover { background: var(--bg-hover); border-color: var(--border-hover); }
    .link-btn .label { flex: 1; text-align: left; }
    .link-btn .arrow { color: var(--arrow); font-size: 16px; }

    .footer { font-size: 12px; color: var(--text-foot); margin-top: 0.25rem; }
  </style>
</head>
<body>

  <button class="theme-toggle" onclick="toggleTheme()" title="Cambiar tema">
    <svg class="icon-moon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
      <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
    </svg>
    <svg class="icon-sun" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
      <circle cx="12" cy="12" r="5"/>
      <line x1="12" y1="1" x2="12" y2="3"/>
      <line x1="12" y1="21" x2="12" y2="23"/>
      <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/>
      <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
      <line x1="1" y1="12" x2="3" y2="12"/>
      <line x1="21" y1="12" x2="23" y2="12"/>
      <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/>
      <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
    </svg>
  </button>

  <div class="card">

    <div class="avatar-wrap">
      <img class="avatar" src="avatar.jpg" alt="Paco Albacete" />

      <div class="status-dot"></div>
    </div>

    <h1 class="name">Paco Albacete</h1>
    <p class="role">Desarrollador · Estudiante de Informática</p>
    <p class="location">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/>
        <circle cx="12" cy="10" r="3"/>
      </svg>
      España
    </p>

    <div class="divider"></div>

    <div class="links">

      <a class="link-btn" href="https://github.com/pacoalbacetec" target="_blank" rel="noopener">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <path d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.87a3.37 3.37 0 0 0-.94-2.61c3.14-.35 6.44-1.54 6.44-7A5.44 5.44 0 0 0 20 4.77 5.07 5.07 0 0 0 19.91 1S18.73.65 16 2.48a13.38 13.38 0 0 0-7 0C6.27.65 5.09 1 5.09 1A5.07 5.07 0 0 0 5 4.77a5.44 5.44 0 0 0-1.5 3.78c0 5.42 3.3 6.61 6.44 7A3.37 3.37 0 0 0 9 18.13V22"/>
        </svg>
        <span class="label">GitHub</span>
        <span class="arrow">↗</span>
      </a>

      <a class="link-btn" href="https://www.linkedin.com/in/francisco-albacete-chicano" target="_blank" rel="noopener">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <path d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-2-2 2 2 0 0 0-2 2v7h-4v-7a6 6 0 0 1 6-6z"/>
          <rect x="2" y="9" width="4" height="12"/>
          <circle cx="4" cy="4" r="2"/>
        </svg>
        <span class="label">LinkedIn</span>
        <span class="arrow">↗</span>
      </a>

      <a class="link-btn" href="mailto:pacoalbacete06@gmail.com">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
          <polyline points="22,6 12,13 2,6"/>
        </svg>
        <span class="label">pacoalbacete06@gmail.com</span>
        <span class="arrow">↗</span>
      </a>

    </div>

    <p class="footer">pacoalbacetec.dev</p>
  </div>

  <script>
    function toggleTheme() {
      const html = document.documentElement;
      html.dataset.theme = html.dataset.theme === 'dark' ? 'light' : 'dark';
      localStorage.setItem('theme', html.dataset.theme);
    }

    const saved = localStorage.getItem('theme');
    const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
    if (saved) {
      document.documentElement.dataset.theme = saved;
    } else if (prefersDark) {
      document.documentElement.dataset.theme = 'dark';
    }
  </script>
</body>
</html>
