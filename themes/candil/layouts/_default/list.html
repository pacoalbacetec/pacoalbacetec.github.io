{{ define "main" }}
<header class="pagina-cabecera">
  <h1>{{ .Title }}</h1>
  {{ with .Content }}<div class="pagina-intro">{{ . }}</div>{{ end }}
</header>
{{ range .Pages.GroupByDate "2006" }}
<section class="anio">
  <h2 class="seccion-titulo"><span>{{ .Key }}</span></h2>
  <ul class="lista-posts">
    {{ range .Pages }}{{ partial "post-item.html" . }}{{ end }}
  </ul>
</section>
{{ end }}
{{ end }}
