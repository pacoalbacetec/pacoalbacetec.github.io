<!doctype html>
<html lang="{{ site.Language.LanguageCode | default "es" }}">
<head>
  {{ partial "head.html" . }}
</head>
<body class="{{ if .IsHome }}is-home{{ else }}is-{{ .Kind }}{{ end }}">
  <div class="progress" aria-hidden="true"></div>
  {{ partial "header.html" . }}
  <main id="contenido" class="wrap">
    {{ block "main" . }}{{ end }}
  </main>
  {{ partial "footer.html" . }}
  {{ $js := resources.Get "js/candil.js" | minify | fingerprint }}
  <script src="{{ $js.RelPermalink }}" defer></script>
</body>
</html>
