{{/* Tiempo de lectura en tacitas de café: una por cada ~5 minutos */}}
{{ $min := .ReadingTime }}
{{ $n := math.Min 5 (math.Max 1 (math.Ceil (div (float $min) 5))) }}
<span class="cafes" title="{{ $min }} min de lectura" aria-label="{{ $min }} minutos de lectura">
  {{ range seq (int $n) }}<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M5.5 2.2c-.6.8.6 1.3 0 2.2M8.5 2.2c-.6.8.6 1.3 0 2.2" class="vapor"/><path d="M2.5 6.5h9v3.5a3.5 3.5 0 0 1-3.5 3.5H6A3.5 3.5 0 0 1 2.5 10z"/><path d="M11.5 7.5h.8a1.6 1.6 0 0 1 0 3.2h-1"/></svg>{{ end }}
</span>
