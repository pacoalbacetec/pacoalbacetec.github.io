<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ if .IsHome }}{{ site.Title }}{{ else }}{{ .Title }} · {{ site.Title }}{{ end }}</title>
<meta name="description" content="{{ with .Description }}{{ . }}{{ else }}{{ with .Summary }}{{ . | plainify | truncate 160 }}{{ else }}{{ site.Params.description }}{{ end }}{{ end }}">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f5ede1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1f1915" media="(prefers-color-scheme: dark)">
<link rel="canonical" href="{{ .Permalink }}">
{{ with .OutputFormats.Get "rss" }}<link rel="alternate" type="application/rss+xml" href="{{ .RelPermalink }}" title="{{ site.Title }}">{{ end }}

{{/* Aplica el tema guardado antes de pintar, para que no parpadee */}}
<script>
  (function () {
    try {
      var t = localStorage.getItem("candil-tema");
      if (t) document.documentElement.dataset.theme = t;
    } catch (e) {}
  })();
</script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT@0,9..144,300..700,50..100;1,9..144,300..600,100&family=Newsreader:ital,opsz,wght@0,6..72,400..600;1,6..72,400..500&family=Caveat:wght@500;600&family=JetBrains+Mono:wght@400;600&display=swap">

{{ $css := resources.Get "css/candil.css" | minify | fingerprint }}
<link rel="stylesheet" href="{{ $css.RelPermalink }}">

<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><path d='M16 4c3 4 5 7 5 10a5 5 0 0 1-10 0c0-3 2-6 5-10z' fill='%23d9822b'/><rect x='9' y='20' width='14' height='6' rx='2' fill='%23b4532f'/></svg>">

<meta property="og:title" content="{{ .Title | default site.Title }}">
<meta property="og:type" content="{{ if .IsPage }}article{{ else }}website{{ end }}">
<meta property="og:url" content="{{ .Permalink }}">
